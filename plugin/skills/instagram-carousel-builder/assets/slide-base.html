<!doctype html>
<!--
  slide-base.html: the starting point for every carousel's slides.html.

  The contract render.py measures against (keep these class names; restyle everything else):
    .slide       one per slide, exactly 1080x1350, in order. data-type = cover|stake|point|steps|stat|quote|recap|cta
    .headline    exactly one per slide, the first text on the slide (nothing readable above it)
    .visual      the slide's visual (SVG or HTML), at least one per slide; data-kind names it (funnel, compare...)
    .foot        the footer: .site holds BUILDABLELABS.COM, .cue the swipe cue (leave .cue out on the last slide)
    .decor       decoration only (shapes, grids, tape, lines). Ignored by the overlap and coverage checks,
                 so never put copy inside it.
    .source      the source line on a stat slide

  Fonts: one Google Fonts <link> with every family and weight the design uses (display=block, so the
  render waits for them). Sizes in px at 1080 wide; nothing under 34px, no weight under 400.
  Replace every TOKEN below with the design's values from design.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAROUSEL TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block">
<style>
:root{
  --bg:#0A0B0E; --text:#F5F6F8; --muted:#B8BECC; --accent:#6789EC; --fill:#0B3FDE; --on-fill:#FFFFFF;
  --f-display:"Instrument Serif", Georgia, serif;
  --f-body:"Manrope", Helvetica, Arial, sans-serif;
  --f-label:"JetBrains Mono", Menlo, monospace;
  --m:88px;                       /* outer margin: 80px or more keeps text clear of the profile-grid crop */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111}
body{width:1080px}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-body)}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}
.frame{position:absolute;inset:var(--m);display:flex;flex-direction:column;gap:48px;z-index:1}
.headline{font-family:var(--f-display);font-weight:400;font-size:96px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.slide[data-type=cover] .headline{font-size:120px}
.sub{font-size:44px;font-weight:600;line-height:1.25;color:var(--muted);max-width:880px}
.visual{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.visual svg{width:100%;height:100%}
.source{font-family:var(--f-label);font-size:34px;color:var(--muted)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-label);font-size:34px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.foot .cue{color:var(--accent)}
/* emphasis: one key word per slide. A highlight block keeps a gap from the lines around it. */
.headline:has(.mark){line-height:1.18}
.mark{display:inline-block;line-height:.95;padding:.03em .16em .18em;margin:.12em 0;background:var(--fill);color:var(--on-fill)}
</style>
</head>
<body>

<section class="slide" data-type="cover">
  <div class="decor" aria-hidden="true"></div>
  <div class="frame">
    <h1 class="headline">Cover headline, <span class="mark">10 words</span> or fewer</h1>
    <div class="visual" data-kind="compare">
      <svg viewBox="0 0 904 640" role="img" aria-label="describe the infographic">
        <!-- draw the infographic: every <text> at font-size 34 or more in viewBox units that map 1:1 to px -->
      </svg>
    </div>
    <footer class="foot"><span class="site">BUILDABLELABS.COM</span><span class="cue">Swipe →</span></footer>
  </div>
</section>

<!-- ... one <section class="slide"> per slide, 6 at most ... -->

<section class="slide" data-type="cta">
  <div class="decor" aria-hidden="true"></div>
  <div class="frame">
    <h2 class="headline">Send this to the person who needs it</h2>
    <div class="visual" data-kind="checklist"></div>
    <footer class="foot"><span class="site">BUILDABLELABS.COM</span></footer>
  </div>
</section>

</body>
</html>
